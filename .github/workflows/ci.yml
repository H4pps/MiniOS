name: C and C++ checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
      VCPKG_DISABLE_METRICS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install LLVM and vcpkg prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-format-18 clang-tidy-18 python3-venv curl zip unzip tar pkg-config
          mkdir -p "$RUNNER_TEMP/llvm-bin"
          for tool in clang clang++ clang-format clang-tidy; do
            ln -s "$(command -v "$tool-18")" "$RUNNER_TEMP/llvm-bin/$tool"
          done
          echo "$RUNNER_TEMP/llvm-bin" >> "$GITHUB_PATH"
      - name: Bootstrap build tools and vcpkg
        run: ./scripts/setup.sh
      - name: Formatting, static analysis, unit tests, and sanitizers
        run: ./scripts/dev.sh check-host

  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install cross-compilation and emulator prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 clang-format-18 clang-tidy-18 qemu-system-arm python3-venv
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
      - name: Prepare local build tools (no hosted dependencies)
        run: ./scripts/setup.sh --kernel
      - name: Check source formatting
        run: ./scripts/dev.sh format-check
      - name: Analyze and verify debug kernel
        run: |
          ./scripts/dev.sh kernel-lint kernel-debug
          ./scripts/dev.sh kernel-test kernel-debug
      - name: Analyze and verify release kernel
        run: |
          ./scripts/dev.sh kernel-lint kernel-release
          ./scripts/dev.sh kernel-test kernel-release
